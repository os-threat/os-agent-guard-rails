name: typeql-ci

on:
  push:
    branches: [main]
    paths:
      - "code/rpa_plugin_skill/**"
      - ".github/workflows/typeql-ci.yml"
      - "skills/typedb/**"
  pull_request:
    paths:
      - "code/rpa_plugin_skill/**"
      - ".github/workflows/typeql-ci.yml"
      - "skills/typedb/**"
  workflow_dispatch:

jobs:
  validate-typeql:
    runs-on: ubuntu-latest
    env:
      TYPEDB_ADDRESS: 127.0.0.1:1729
    services:
      typedb:
        image: typedb/typedb:3.8.3
        ports:
          - 1729:1729
          - 8000:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/rpa_plugin_skill/typeql_ci/requirements.txt

      - name: Install TypeDB Python driver
        run: pip install -r code/rpa_plugin_skill/typeql_ci/requirements.txt

      - name: Validate TypeQL fixtures
        run: python code/rpa_plugin_skill/typeql_ci/validate_typeql.py

      - name: Validate Layer B contract seed/query checks
        run: python -m scripts.check_layer_b_contract
        working-directory: code/rpa_plugin_skill
