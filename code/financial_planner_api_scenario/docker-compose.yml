services:
  mongo:
    image: mongo:7
    container_name: fp-mini-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-financial_planner}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - fp-mini-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fp-mini-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8082"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/financial_planner}
      AUTO_SEED: ${AUTO_SEED:-true}
    ports:
      - "${API_PORT:-8082}:8082"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  fp-mini-mongo-data:
