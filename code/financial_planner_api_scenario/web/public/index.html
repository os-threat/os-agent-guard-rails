<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Financial Services Mini App</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Financial Services Mini App</h1>
      <p class="muted">Iframe-safe tabbed operations workspace (Windows dev + Docker Desktop runtime).</p>
    </div>
    <div class="status-row">
      <span id="health-indicator" class="status-pill unknown">Checking API...</span>
    </div>
  </header>

  <nav id="tab-nav" class="tab-nav"></nav>

  <main id="panel-root" class="panel-root"></main>

  <template id="panel-template">
    <section class="panel">
      <div class="panel-top">
        <h2 class="panel-title"></h2>
        <button type="button" class="refresh-btn">Refresh</button>
      </div>
      <p class="panel-help"></p>
      <div class="panel-grid">
        <section class="card form-card">
          <h3>Form</h3>
          <form class="object-form"></form>
          <div class="form-actions">
            <button type="submit" form="" class="submit-btn">Save</button>
          </div>
          <p class="muted small">Form-first workflow. JSON is available as a secondary diagnostics view.</p>
        </section>
        <section class="card list-card">
          <h3>Records</h3>
          <div class="list-meta"></div>
          <ul class="record-list"></ul>
        </section>
      </div>
      <details class="json-diagnostics">
        <summary>JSON diagnostics (secondary view)</summary>
        <pre class="json-output"></pre>
      </details>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
