openapi: 3.0.3
info:
  title: Financial Planner Demo API
  description: |
    Fictional REST API for OS-Agent Guard Rails demos (OpenAPI → TypeQL shadow path).
    **Not** investment advice. All errors use JSON Problem Details (`application/problem+json`) with `trace_id`.

    **MongoDB mapping (Layer A extract):**
    - `GET/POST /v1/clients` → collection `clients`
    - `GET/POST /v1/accounts` → `accounts`
    - `GET/POST /v1/accounts/{accountId}/holdings` → `holdings`
    - `GET/POST /v1/plans` → `plans`
    - `GET/POST /v1/plans/{planId}/goals` → `goals`
    - `POST /v1/recommendations` → reads above; writes `recommendation_audit`
    - `POST /v1/trades` → `trade_preview_audit`, `executed_trades`, `wash_sale_events`
    - `GET /v1/fees` → `fee_schedules`
    - `POST /v1/documents` → `disclosures`

    **Risk tier vs dominant asset class (FP-R02 appendix):**
    - `conservative`: allowed `fixed_income`, `short_duration`, `cash`; not `equity` as dominant.
    - `moderate`: allowed `equity`, `fixed_income`, `alternatives`, `short_duration`, `cash`; `long_duration` only if no client goal `target_date` within 5 years (FP-R09).
    - `aggressive`: all dominant classes allowed subject to other rules.
  version: 1.0.0
  license:
    name: Proprietary
    url: https://example.local/license

servers:
  - url: http://localhost:8082
    description: Local Docker Desktop / WSL (API + MongoDB)

tags:
  - name: Health
    description: Liveness for orchestration
  - name: Clients
    description: KYC tier, risk profile — collection `clients`
  - name: Accounts
    description: Account types — collection `accounts`
  - name: Holdings
    description: Positions — collection `holdings`
  - name: Plans
    description: Financial plans — collection `plans`
  - name: Goals
    description: Plan goals — collection `goals`
  - name: Recommendations
    description: Suitability recommendations — `recommendation_audit`
  - name: Trades
    description: Preview and execute — `trade_preview_audit`, `executed_trades`
  - name: Fees
    description: Schedules — `fee_schedules`
  - name: Documents
    description: Disclosure acceptance — `disclosures`

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Used by Docker/Kubernetes; does not require MongoDB to respond.
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
              examples:
                default:
                  value:
                    status: ok

  /v1/clients:
    get:
      tags: [Clients]
      summary: List clients
      description: Reads `clients` with optional pagination.
      operationId: listClients
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResponse"
        "400":
          $ref: "#/components/responses/Problem400"
        "500":
          $ref: "#/components/responses/Problem500"
    post:
      tags: [Clients]
      summary: Create client
      description: Inserts into `clients`.
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
            examples:
              sample:
                value:
                  id: C-NEW
                  display_name: New Client
                  kyc_tier: retail
                  risk_tier: moderate
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/Problem400"
        "409":
          $ref: "#/components/responses/Problem409"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/clients/{id}:
    get:
      tags: [Clients]
      summary: Get client by id
      description: Reads `clients` by `_id` or `id` field.
      operationId: getClient
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"
    patch:
      tags: [Clients]
      summary: Update client
      description: Partial update on `clients`.
      operationId: patchClient
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      description: Reads `accounts`; filter by `client_id`.
      operationId: listAccounts
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by owning client id
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
        "400":
          $ref: "#/components/responses/Problem400"
        "500":
          $ref: "#/components/responses/Problem500"
    post:
      tags: [Accounts]
      summary: Create account
      description: Inserts into `accounts`.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Problem400"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/accounts/{accountId}/holdings:
    get:
      tags: [Holdings]
      summary: List holdings for account
      description: Reads `holdings` for `account_id`.
      operationId: listHoldings
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingListResponse"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"
    post:
      tags: [Holdings]
      summary: Add or replace holding line
      description: Upserts into `holdings` for the account.
      operationId: createHolding
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "400":
          $ref: "#/components/responses/Problem400"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/plans:
    get:
      tags: [Plans]
      summary: List plans
      description: Reads `plans`.
      operationId: listPlans
      parameters:
        - name: client_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanListResponse"
        "500":
          $ref: "#/components/responses/Problem500"
    post:
      tags: [Plans]
      summary: Create plan
      description: Inserts into `plans`.
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem400"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/plans/{planId}/goals:
    get:
      tags: [Goals]
      summary: List goals for plan
      description: Reads `goals` for `plan_id`.
      operationId: listGoals
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListResponse"
        "404":
          $ref: "#/components/responses/Problem404"
        "500":
          $ref: "#/components/responses/Problem500"
    post:
      tags: [Goals]
      summary: Create goal
      description: Inserts into `goals`.
      operationId: createGoal
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem400"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/recommendations:
    post:
      tags: [Recommendations]
      summary: Request investment recommendation
      description: |
        **Mutating POST — requires `Idempotency-Key` (FP-R06).** Evaluates FP-R01, FP-R02, FP-R03, FP-R09, FP-R12 against request and client state in MongoDB.
        Writes `recommendation_audit` on success or denial.
      operationId: postRecommendation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
            examples:
              allowPath:
                summary: C-ALLOW diversified
                value:
                  client_id: C-ALLOW
                  proposed_symbol: VTI
                  dominant_asset_class: equity
                  instrument_requires_accredited: false
                  long_duration_only_stance: false
                  horizon_years: 15
              denyConcentration:
                summary: C-DENY concentration
                value:
                  client_id: C-DENY
                  proposed_symbol: AAPL
                  dominant_asset_class: equity
                  instrument_requires_accredited: false
                  long_duration_only_stance: false
                  horizon_years: 10
      responses:
        "200":
          description: Recommendation allowed (guard ALLOW)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResult"
        "400":
          $ref: "#/components/responses/Problem400"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "422":
          $ref: "#/components/responses/Problem422"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/trades:
    post:
      tags: [Trades]
      summary: Preview or execute trade
      description: |
        **Mutating POST — requires `Idempotency-Key` (FP-R06).** `preview: true` stores `trade_preview_audit` and returns `preview_id` (FP-R05).
        Execute path enforces FP-R04, FP-R05, FP-R07, FP-R08, FP-R11.
      operationId: postTrade
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
            examples:
              preview:
                value:
                  preview: true
                  client_id: C-ALLOW
                  account_id: A-CALLOW-1
                  symbol: VTI
                  side: buy
                  quantity: 10
                  incurs_fee: true
                  session_id: demo-session-1
      responses:
        "200":
          description: Preview or execute result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "400":
          $ref: "#/components/responses/Problem400"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "422":
          $ref: "#/components/responses/Problem422"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/fees:
    get:
      tags: [Fees]
      summary: Fee schedule lookup
      description: Reads `fee_schedules` (optional filters).
      operationId: listFees
      parameters:
        - name: account_type
          in: query
          schema:
            $ref: "#/components/schemas/AccountType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeListResponse"
        "500":
          $ref: "#/components/responses/Problem500"

  /v1/documents:
    post:
      tags: [Documents]
      summary: Record disclosure acceptance
      description: Inserts into `disclosures` for FP-R04 windowing.
      operationId: postDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAcceptance"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecord"
        "400":
          $ref: "#/components/responses/Problem400"
        "500":
          $ref: "#/components/responses/Problem500"

components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ClientId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Client id (e.g. C-ALLOW)
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID v4 required for mutating POSTs (FP-R06)

  schemas:
    ProblemDetails:
      type: object
      required: [title, status, trace_id]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string
          format: uuid
        rule_id:
          type: string
          description: e.g. FP-R01
        witness:
          type: object
          additionalProperties: true

    Client:
      type: object
      required: [id, display_name, kyc_tier, risk_tier]
      properties:
        id:
          type: string
        display_name:
          type: string
        kyc_tier:
          type: string
          enum: [retail, accredited, qualified]
        risk_tier:
          type: string
          enum: [conservative, moderate, aggressive]
    ClientCreate:
      type: object
      required: [id, display_name, kyc_tier, risk_tier]
      properties:
        id: { type: string }
        display_name: { type: string }
        kyc_tier:
          type: string
          enum: [retail, accredited, qualified]
        risk_tier:
          type: string
          enum: [conservative, moderate, aggressive]
    ClientPatch:
      type: object
      properties:
        display_name: { type: string }
        kyc_tier:
          type: string
          enum: [retail, accredited, qualified]
        risk_tier:
          type: string
          enum: [conservative, moderate, aggressive]
    ClientListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer

    AccountType:
      type: string
      enum: [IRA, TAXABLE, ROLLOVER_401K]
    Account:
      type: object
      required: [id, client_id, type]
      properties:
        id: { type: string }
        client_id: { type: string }
        type:
          $ref: "#/components/schemas/AccountType"
        nickname:
          type: string
    AccountCreate:
      type: object
      required: [id, client_id, type]
      properties:
        id: { type: string }
        client_id: { type: string }
        type:
          $ref: "#/components/schemas/AccountType"
        nickname:
          type: string
    AccountListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        total:
          type: integer

    Holding:
      type: object
      required: [account_id, symbol, quantity, market_value_usd, sector]
      properties:
        account_id: { type: string }
        symbol: { type: string }
        quantity: { type: number }
        cost_basis_usd: { type: number }
        market_value_usd: { type: number }
        sector:
          type: string
          description: GICS sector label for FP-R12
        flags:
          type: array
          items:
            type: string
          description: e.g. margin_only, accredited_only, ira_restricted
    HoldingCreate:
      type: object
      required: [symbol, quantity, market_value_usd, sector]
      properties:
        symbol: { type: string }
        quantity: { type: number }
        cost_basis_usd: { type: number }
        market_value_usd: { type: number }
        sector: { type: string }
        flags:
          type: array
          items: { type: string }
    HoldingListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Holding"
        total:
          type: integer

    Plan:
      type: object
      required: [id, client_id, name]
      properties:
        id: { type: string }
        client_id: { type: string }
        name: { type: string }
    PlanCreate:
      type: object
      required: [id, client_id, name]
      properties:
        id: { type: string }
        client_id: { type: string }
        name: { type: string }
    PlanListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        total:
          type: integer

    Goal:
      type: object
      required: [id, plan_id, name, target_date, target_amount_usd]
      properties:
        id: { type: string }
        plan_id: { type: string }
        name: { type: string }
        target_date:
          type: string
          format: date
        target_amount_usd: { type: number }
    GoalCreate:
      type: object
      required: [id, name, target_date, target_amount_usd]
      properties:
        id: { type: string }
        name: { type: string }
        target_date:
          type: string
          format: date
        target_amount_usd: { type: number }
    GoalListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        total:
          type: integer

    DominantAssetClass:
      type: string
      enum: [equity, fixed_income, alternatives, long_duration, short_duration, cash]

    RecommendationRequest:
      type: object
      required:
        - client_id
        - proposed_symbol
        - dominant_asset_class
        - instrument_requires_accredited
        - long_duration_only_stance
        - horizon_years
      properties:
        client_id: { type: string }
        proposed_symbol: { type: string }
        dominant_asset_class:
          $ref: "#/components/schemas/DominantAssetClass"
        instrument_requires_accredited: { type: boolean }
        long_duration_only_stance: { type: boolean }
        horizon_years: { type: number }
        proposed_sector:
          type: string
          description: Optional GICS sector label for proposed symbol (FP-R12)

    RecommendationResult:
      type: object
      required: [guard_status, client_id, proposed_symbol]
      properties:
        guard_status:
          type: string
          enum: [ALLOW, DENY]
        client_id: { type: string }
        proposed_symbol: { type: string }
        rule_id:
          type: string
        witness:
          type: object
          additionalProperties: true
        notes:
          type: string

    TradeRequest:
      type: object
      required:
        - preview
        - client_id
        - account_id
        - symbol
        - side
        - quantity
        - incurs_fee
      properties:
        preview: { type: boolean }
        preview_id:
          type: string
          description: Required for execute when preview was created earlier (FP-R05)
        client_id: { type: string }
        account_id: { type: string }
        symbol: { type: string }
        side:
          type: string
          enum: [buy, sell]
        quantity: { type: number }
        incurs_fee: { type: boolean }
        session_id:
          type: string
          description: Groups preview + execute for FP-R05

    TradeResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [preview_created, executed, denied]
        preview_id:
          type: string
        trade_id:
          type: string
        rule_id:
          type: string
        witness:
          type: object
          additionalProperties: true

    FeeSchedule:
      type: object
      properties:
        id: { type: string }
        account_type:
          $ref: "#/components/schemas/AccountType"
        description: { type: string }
        rate_bps: { type: number }
    FeeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeeSchedule"

    DocumentAcceptance:
      type: object
      required: [account_id, disclosure_id, accepted_at]
      properties:
        account_id: { type: string }
        disclosure_id: { type: string }
        accepted_at:
          type: string
          format: date-time
    DocumentRecord:
      type: object
      required: [id, account_id, disclosure_id, accepted_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        disclosure_id: { type: string }
        accepted_at:
          type: string
          format: date-time

  responses:
    Problem400:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Problem403:
      description: Forbidden — policy denial
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Problem404:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Problem409:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Problem422:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Problem500:
      description: Server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
