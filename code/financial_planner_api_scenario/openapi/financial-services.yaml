openapi: 3.0.3
info:
  title: Financial Services Mini App API
  version: 0.2.0
  description: >
    OpenAPI contract for the financial services v2 mini-app. This API models clients,
    households, investments, savings, superannuation, insurance, communications, campaigns,
    tasks, anniversaries, tax checkpoints, and admin/dashboard operations.
servers:
  - url: http://localhost:8082
tags:
  - name: clients
  - name: households
  - name: profiles
  - name: dates
  - name: investments
  - name: savings
  - name: super
  - name: insurance
  - name: workflows
  - name: admin
  - name: dashboard
  - name: addresses
  - name: recommendations
paths:
  /admin/health:
    get:
      operationId: adminHealth
      summary: Health check
      tags: [admin]
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /admin/jobs/seed:
    post:
      operationId: adminJobsSeed
      summary: Run rich synthetic seed
      tags: [admin]
      responses:
        "201":
          description: Completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/jobs/seed-fixtures:
    post:
