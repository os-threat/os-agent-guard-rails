components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
    MetricsResponse:
      type: object
      properties:
        active_clients:
          type: integer
        upcoming_anniversaries:
          type: integer
        pending_tasks:
          type: integer
    ListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
    Client:
      type: object
      required: [first_name, last_name, date_of_birth]
      properties:
        id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        communication_preference:
          type: string
    ClientPatch:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        address:
          type: string
        communication_preference:
          type: string
    Household:
      type: object
      properties:
        id:
          type: string
        primary_client_id:
          type: string
        household_name:
          type: string
    DomainRecord:
      type: object
      additionalProperties: true
    DomainPatch:
      type: object
      additionalProperties: true
    Address:
      type: object
      required: [client_id, line1, suburb, state, postcode]
      properties:
        id:
          type: string
        client_id:
          type: string
        line1:
          type: string
        suburb:
          type: string
        state:
          type: string
        postcode:
          type: string
        country:
          type: string
    ProblemDetails:
      type: object
      required: [title, status, trace_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string
  responses:
    Problem:
      description: Problem details response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
