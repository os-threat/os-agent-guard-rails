# TypeDB Community Edition for local development of the RPA plugin/skill.
# One server process = one TypeDB *instance*; create multiple *named databases* from the client
# (Layer C, Layer B, one Layer A per registered SQL/API app). See code/rpa_plugin_skill/README.md.
#
# TypeDB 3.8+ TypeQL reference: ../../../skills/typedb/SKILL.md
#
# Usage (from this directory):
#   docker compose up -d
#   docker compose ps
#
# Default driver address: localhost:1729  (set TYPEDB_ADDRESS in app config)

services:
  typedb:
    image: typedb/typedb:3.8.3
    container_name: os-agent-rpa-typedb
    restart: unless-stopped
    ports:
      - "1729:1729"
      - "8000:8000"
    volumes:
      - typedb-data:/var/lib/typedb/data

volumes:
  typedb-data:
